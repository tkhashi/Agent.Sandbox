[project]
name = "classifier-arch-drawing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tkhashi", email = "pupodenews@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
]

[project.scripts]
extract-vectors = "classifier_arch_drawing.cli:main"
classify-grid-lines = "classifier_arch_drawing.classify_cli:main"
classify-dimension-lines = "classifier_arch_drawing.classify_cli:main_dimension"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
